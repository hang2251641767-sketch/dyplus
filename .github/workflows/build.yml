name: Build DYPlus dylib

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dylib:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Prepare Theos
        uses: huami1314/theos-action@c5ddc7728cc1bcac2f07ab65fbc3022d25ce0c10
        with:
          theos-dir: ${{ runner.temp }}/theos

      - name: Setup GNU Make
        shell: bash
        run: echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Static preflight
        shell: bash
        run: |
          test -f LICENSE
          test -f DYPlusFeatureRegistry.m
          test -f DYPlusCompatibilityViewController.m
          test -f DYPlus.plist
          git diff --check
          bash -n scripts/export-dylib.sh

      - name: Build standalone arm64 dylib
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make all ARCHS=arm64 SCHEME= FINALPACKAGE=1 INSTALL=0 -j"$(sysctl -n hw.ncpu)" 2>&1 | tee build.log

      - name: Test assistant configuration
        shell: bash
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -framework Foundation -I. DYYYAssistantPreferences.m tests/AssistantPreferencesTests.m -o "$RUNNER_TEMP/assistant-tests"
          "$RUNNER_TEMP/assistant-tests"

      - name: Test focused diagnostic selection
        shell: bash
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -framework Foundation -I. DYYYAssistantDiagnosticPlan.m tests/AssistantDiagnosticPlanTests.m -o "$RUNNER_TEMP/diagnostic-tests"
          "$RUNNER_TEMP/diagnostic-tests"

      - name: Verify and export dylib
        shell: bash
        run: bash scripts/export-dylib.sh

      - name: Test diagnostic recovery and runtime inspection
        shell: bash
        run: |
          xcrun --sdk macosx clang -fobjc-arc -fblocks -framework Foundation -I. DYYYAssistantRuntimeInspector.m DYYYAssistantDiagnosticArchive.m tests/AssistantDiagnosticSafetyTests.m -o "$RUNNER_TEMP/diagnostic-safety-tests"
          "$RUNNER_TEMP/diagnostic-safety-tests"

      - name: Upload DYPlus for TrollFools
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DouyinAssistantPLUS-V1.1.2-diagnostics-fix-arm64-TrollFools
          path: dist/
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: DYPlus-build-log
          path: build.log
          if-no-files-found: ignore
